services:
  - type: web
    name: deepfake-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_FALLBACK_MODEL
        value: llama-3.1-8b-instant
      - key: MODEL_WEIGHTS_URL
        sync: false
        # Set this to your HuggingFace Hub direct download URL after running:
        # python backend/upload_model_to_huggingface.py
        # Example: https://huggingface.co/your_username/aegisvision-weights/resolve/main/efficientnet_b0_deepfake.pth
    plan: free
    # NOTE: Free tier has 512 MB RAM. EfficientNet-B0 inference uses ~300 MB.
    # If you get OOM errors during inference, upgrade to Starter plan (512 MB guaranteed).
